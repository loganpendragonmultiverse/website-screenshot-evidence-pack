name: Release build
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify tag and package identity
        run: |
          python - <<'PY'
          import ast, os, re, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          tag = os.environ["GITHUB_REF_NAME"]
          assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag)
          assert project["name"] == "website-screenshot-evidence-pack"
          assert tag == "v" + project["version"]
          module = ast.parse(Path("src/screenshot_evidence_pack/__init__.py").read_text())
          versions = [ast.literal_eval(node.value) for node in module.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)]
          assert versions == [project["version"]]
          PY
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src tests
      - run: python -m pytest
      - run: python -m pip_audit
      - run: python -m build
      - name: Verify built identities and write exact checksums
        run: |
          python - <<'PY'
          import hashlib, os, re, tarfile, tomllib, zipfile
          from email.parser import BytesParser
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version
          stem = re.sub(r"[-_.]+", "_", project["name"])
          wheel = Path("dist") / (stem + "-" + version + "-py3-none-any.whl")
          sdist = Path("dist") / (stem + "-" + version + ".tar.gz")
          assert set(Path("dist").iterdir()) == {wheel, sdist}
          with zipfile.ZipFile(wheel) as package:
              metadata = [name for name in package.namelist() if name.endswith(".dist-info/METADATA")]
              assert len(metadata) == 1
              wheel_info = BytesParser().parsebytes(package.read(metadata[0]))
          with tarfile.open(sdist) as package:
              member = package.extractfile(stem + "-" + version + "/PKG-INFO")
              assert member is not None
              sdist_info = BytesParser().parsebytes(member.read())
          for info in [wheel_info, sdist_info]:
              assert info["Name"] == project["name"] and info["Version"] == version
              assert info["Requires-Python"] == project["requires-python"]
          payloads = sorted([wheel, sdist])
          Path("dist/SHA256SUMS").write_text("".join(hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name + "\n" for path in payloads))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
