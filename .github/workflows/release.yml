name: Release build
on:
  push: { tags: ["v*"] }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - name: Hash tagged distributions
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          files = sorted(p for p in Path("dist").iterdir() if p.is_file())
          assert len(files) == 2
          Path("dist/SHA256SUMS").write_text(
              "".join(hashlib.sha256(p.read_bytes()).hexdigest() + "  " + p.name + "\n" for p in files),
              encoding="utf-8",
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: python-distributions, path: "dist/*" }
