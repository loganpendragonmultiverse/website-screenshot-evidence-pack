name: Feature request
description: Propose a focused evidence-pack improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What evidence workflow is not covered? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior, description: Explain the safe local behavior and trust boundary. }
    validations: { required: true }
