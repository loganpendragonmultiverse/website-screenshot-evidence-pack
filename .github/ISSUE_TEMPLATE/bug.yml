name: Bug report
description: Report a reproducible packaging or verification defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Describe what happened without attaching sensitive evidence. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Provide sanitized inputs and exact commands. }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: Operating system and Python version }
    validations: { required: true }
